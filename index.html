<style>
  /* Drop your licensed Ethnocentric files into /assets to override the fallback */
  @font-face {
    font-family: 'Ethnocentric';
    src: url('assets/ethnocentric.woff2') format('woff2'),
         url('assets/ethnocentric.woff')  format('woff');
    font-weight: 400 900;
    font-display: swap;
  }

  :root {
    --bg: #000000;
    --fg: #ffffff;
    --glow: 0 0 6px rgba(255,255,255,.9), 0 0 16px rgba(255,255,255,.55), 0 0 34px rgba(255,255,255,.35);
    --display: 'Ethnocentric', 'Orbitron', sans-serif;
    --gap: clamp(28px, 5vw, 64px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--display);
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: var(--gap);
    z-index: 1;
  }

  /* ---------- Background Video ---------- */
  .bg-video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -2; pointer-events: none;
  }
  .bg-scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: -1; pointer-events: none;
  }

  /* ---------- Sound Toggle ---------- */
  .sound-btn {
    position: fixed;
    right: clamp(18px, 3vw, 36px);
    bottom: clamp(18px, 3vw, 36px);
    z-index: 5;
    width: clamp(46px, 4vw, 56px); height: clamp(46px, 4vw, 56px);
    border: 2px solid var(--fg); border-radius: 50%;
    background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
    color: var(--fg); display: grid; place-items: center; cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .sound-btn:hover { transform: translateY(-3px); box-shadow: var(--glow); background: rgba(0,0,0,.55); }
  .sound-btn svg { width: 52%; height: 52%; }
  .sound-btn .icon-unmuted { display: none; }
  .sound-btn.is-unmuted .icon-muted { display: none; }
  .sound-btn.is-unmuted .icon-unmuted { display: block; }

  /* ---------- Header / Logo ---------- */
  header { display: flex; align-items: flex-start; justify-content: center; }
  .logo { display: inline-block; line-height: 0; cursor: pointer; transition: transform .25s ease, filter .25s ease; }
  .logo img { display: block; width: clamp(160px, 17vw, 260px); height: auto; filter: drop-shadow(0 0 12px rgba(120,90,255,.35)); }
  .logo:hover { transform: translateY(-2px) scale(1.02); }
  .logo:hover img { filter: drop-shadow(0 0 18px rgba(150,80,255,.6)); }

  /* ---------- Center Nav ---------- */
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .12em; }
  .hero-link {
    font-family: var(--display);
    background: none; border: none; cursor: pointer;
    color: var(--fg); font-weight: 700; letter-spacing: .02em;
    font-size: clamp(48px, 9vw, 120px); line-height: 1.05; text-transform: uppercase;
    transition: text-shadow .3s ease, transform .3s ease;
  }
  .hero-link:hover { text-shadow: var(--glow); transform: scale(1.03); }

  /* ---------- Footer ---------- */
  footer { display: flex; align-items: center; justify-content: center; gap: clamp(20px, 3vw, 36px); flex-wrap: wrap; }
  .socials { display: flex; gap: 18px; }
  .socials a {
    width: clamp(44px, 4vw, 58px); height: clamp(44px, 4vw, 58px);
    border: 2px solid var(--fg); border-radius: 50%;
    display: grid; place-items: center; color: var(--fg);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .socials a:hover { transform: translateY(-3px); box-shadow: var(--glow); }
  .socials svg { width: 52%; height: 52%; }

  /* ---------- Overlay Panels ---------- */
  .panel {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.88); backdrop-filter: blur(10px);
    padding: clamp(24px, 5vw, 72px);
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden; transform: translateY(20px);
    transition: opacity .35s ease, transform .35s ease, visibility .35s;
    overflow-y: auto;
  }
  .panel.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: clamp(24px, 4vw, 48px); flex-shrink: 0;
  }
  .panel-head h2 {
    font-weight: 900; text-transform: uppercase; letter-spacing: .03em;
    font-size: clamp(34px, 6vw, 72px);
  }
  .panel-close {
    background: none; border: 2px solid var(--fg); border-radius: 50%;
    width: clamp(46px, 4vw, 58px); height: clamp(46px, 4vw, 58px);
    color: var(--fg); cursor: pointer; flex-shrink: 0;
    display: grid; place-items: center; transition: transform .25s ease, box-shadow .25s ease;
  }
  .panel-close:hover { transform: rotate(90deg); box-shadow: var(--glow); }
  .panel-close svg { width: 46%; height: 46%; }

  /* Playlist grid */
  .playlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .playlist-grid iframe { width: 100%; border: 0; border-radius: 12px; }

  /* Events list */
  .events-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .event-card {
    display: block; text-decoration: none; color: var(--fg);
    border: 2px solid rgba(255,255,255,.5); border-radius: 16px;
    padding: 26px; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    background: rgba(255,255,255,.03);
  }
  .event-card:hover { transform: translateY(-4px); border-color: var(--fg); box-shadow: var(--glow); }
  .event-card .ev-date { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
  .event-card .ev-title { font-size: clamp(22px, 2.4vw, 30px); font-weight: 700; margin: 10px 0 6px; text-transform: uppercase; }
  .event-card .ev-venue { font-size: 15px; opacity: .8; }
  .event-card .ev-cta { display: inline-block; margin-top: 18px; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--fg); padding-bottom: 3px; }

  /* Gallery mosaic */
  .mosaic {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    grid-auto-rows: 180px;
    grid-auto-flow: dense;
    gap: 12px;
  }
  .tile { position: relative; overflow: hidden; border-radius: 12px; background: #111; }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .tile:hover img, .tile:hover video { transform: scale(1.06); }
  .tile.wide { grid-column: span 2; }
  .tile.tall { grid-row: span 2; }
  .tile.big  { grid-column: span 2; grid-row: span 2; }
  .tile-hidden { display: none; }
  #gallery-more-wrap { text-align: center; }
  .gallery-more {
    margin: 26px auto 4px; padding: 13px 34px; cursor: pointer;
    background: transparent; color: var(--gold, #C9A84C);
    border: 1px solid var(--gold, #C9A84C); border-radius: 999px;
    font: inherit; font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
    transition: background .25s ease, color .25s ease;
  }
  .gallery-more:hover { background: var(--gold, #C9A84C); color: #0D1B2A; }

  .empty-note { opacity: .6; font-family: 'Orbitron', sans-serif; font-size: 15px; line-height: 1.6; max-width: 640px; }

  @media (max-width: 600px) {
    .mosaic { grid-auto-rows: 140px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }
</style>

function spotifyEmbed(url) {
  // turn open.spotify.com/playlist/ID  ->  open.spotify.com/embed/playlist/ID
  const id = (url.split("/playlist/")[1] || "").split("?")[0];
  return "https://open.spotify.com/embed/playlist/" + id + "?utm_source=generator&theme=0";
}

function renderPlaylists() {
  const grid = document.getElementById("playlist-grid");
  if (!PLAYLISTS.length) { grid.innerHTML = note("No playlists added yet."); return; }
  grid.innerHTML = PLAYLISTS.map(p =>
    '<iframe loading="lazy" height="352" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" src="' + spotifyEmbed(p.url) + '"></iframe>'
  ).join("");
}

function renderEvents() {
  const wrap = document.getElementById("events-list");
  if (!EVENTS.length) { wrap.innerHTML = note("No events added yet."); return; }
  wrap.innerHTML = EVENTS.map(e =>
    '<a class="event-card" href="' + e.url + '"' + (e.url !== "#" ? ' target="_blank" rel="noopener"' : '') + '>' +
      (e.date  ? '<div class="ev-date">'  + e.date  + '</div>' : '') +
      '<div class="ev-title">' + e.title + '</div>' +
      (e.venue ? '<div class="ev-venue">' + e.venue + '</div>' : '') +
      '<span class="ev-cta">Details &amp; tickets</span>' +
    '</a>'
  ).join("");
}

const GALLERY_INITIAL = 16; // tiles shown before "Load more"

  const m = document.getElementById("mosaic");
  if (!GALLERY.length) { m.innerHTML = note("Photos and videos coming soon. Add files to /assets/gallery/ and list them in the GALLERY array."); return; }

    const cls = "tile" + (g.size ? " " + g.size : "") + (i >= GALLERY_INITIAL ? " tile-hidden" : "");

      var poster = g.src.replace(/\.mp4$/, ".jpg");
      return '<div class="' + cls + '"><video src="' + g.src + '" poster="' + poster + '" ' + (i < GALLERY_INITIAL ? 'autoplay ' : '') + 'muted loop playsinline preload="metadata"></video></div>';
    }
    return '<div class="' + cls + '"><img src="' + g.src + '" alt="" loading="lazy"></div>';
  }).join("");

  const hidden = GALLERY.length - GALLERY_INITIAL;
  if (hidden > 0) {
    const wrap = document.getElementById("gallery-more-wrap");
    if (wrap) {
      wrap.innerHTML = '<button id="gallery-more-btn" class="gallery-more">See all (' + hidden + ')</button>';
      document.getElementById("gallery-more-btn").addEventListener("click", function () {
        m.querySelectorAll(".tile-hidden").forEach(t => {
          t.classList.remove("tile-hidden");
          const v = t.querySelector("video"); if (v) { v.autoplay = true; v.play().catch(()=>{}); }
        });
        wrap.innerHTML = "";
      });
    }
  }
}

function note(text) { return '<p class="empty-note">' + text + '</p>'; }

/* open / close panels */
const panels = { playlist: "panel-playlist", events: "panel-events", gallery: "panel-gallery" };
function openPanel(key) {
  const p = document.getElementById(panels[key]);
  if (!p) return;
  p.classList.add("open"); p.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function closePanels() {
  document.querySelectorAll(".panel.open").forEach(p => { p.classList.remove("open"); p.setAttribute("aria-hidden", "true"); });
  document.body.style.overflow = "";
}
document.querySelectorAll(".hero-link").forEach(btn =>
  btn.addEventListener("click", () => openPanel(btn.dataset.panel))
);
document.querySelectorAll(".panel-close").forEach(btn => btn.addEventListener("click", closePanels));
document.querySelectorAll(".panel").forEach(p =>
  p.addEventListener("click", e => { if (e.target === p) closePanels(); })
);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanels(); });

renderPlaylists(); renderEvents(); renderGallery();

/* sound toggle */
(function () {
  const video = document.querySelector('.bg-video');
  const btn = document.getElementById('soundBtn');
  btn.addEventListener('click', function () {
    video.muted = !video.muted;
    btn.classList.toggle('is-unmuted', !video.muted);
    btn.setAttribute('aria-label', video.muted ? 'Unmute sound' : 'Mute sound');
    if (video.paused) { video.play().catch(function () {}); }
  });
})();
</script>

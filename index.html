<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night of Play</title>

<!-- Free fallback that closely matches Ethnocentric's techy feel -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
  /* ----------------------------------------------------------
     DROP IN YOUR LICENSED ETHNOCENTRIC FILES HERE
     Place the .woff2 / .woff in the same folder, then this
     @font-face takes priority over the Orbitron fallback.
  ---------------------------------------------------------- */
  @font-face {
    font-family: 'Ethnocentric';
    src: url('assets/ethnocentric.woff2') format('woff2'),
         url('assets/ethnocentric.woff')  format('woff');
    font-weight: 400 900;
    font-display: swap;
  }

  :root {
    --bg: #000000;
    --fg: #ffffff;
    --glow: 0 0 6px rgba(255,255,255,.9), 0 0 16px rgba(255,255,255,.55), 0 0 34px rgba(255,255,255,.35);
    --display: 'Ethnocentric', 'Orbitron', sans-serif;
    --gap: clamp(28px, 5vw, 64px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--display);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: var(--gap);
    z-index: 1;
  }

  /* ---------- Background Video ---------- */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
  }
  .bg-video::-webkit-media-controls { display: none !important; }
  /* dark scrim so foreground text/logo stays legible */
  .bg-scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- Sound Toggle ---------- */
  .sound-btn {
    position: fixed;
    right: clamp(18px, 3vw, 36px);
    bottom: clamp(18px, 3vw, 36px);
    z-index: 5;
    width: clamp(46px, 4vw, 56px);
    height: clamp(46px, 4vw, 56px);
    border: 2px solid var(--fg);
    border-radius: 50%;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(4px);
    color: var(--fg);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .sound-btn:hover {
    transform: translateY(-3px);
    box-shadow: var(--glow);
    background: rgba(0,0,0,.55);
  }
  .sound-btn svg { width: 52%; height: 52%; }
  .sound-btn .icon-unmuted { display: none; }
  .sound-btn.is-unmuted .icon-muted { display: none; }
  .sound-btn.is-unmuted .icon-unmuted { display: block; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* ---------- Neon Logo ---------- */
  .logo {
    display: inline-block;
    line-height: 0;
    cursor: pointer;
    transition: transform .25s ease, filter .25s ease;
  }
  .logo img {
    display: block;
    width: clamp(150px, 16vw, 240px);
    height: auto;
    filter: drop-shadow(0 0 12px rgba(120,90,255,.35));
  }
  .logo:hover { transform: translateY(-2px) scale(1.02); }
  .logo:hover img { filter: drop-shadow(0 0 18px rgba(150,80,255,.6)); }

  /* ---------- Hamburger ---------- */
  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 6px;
  }
  .menu-btn span {
    display: block;
    width: clamp(40px, 4vw, 58px);
    height: clamp(8px, .8vw, 11px);
    background: var(--fg);
    border-radius: 4px;
    transition: transform .3s ease, opacity .3s ease;
  }
  .menu-btn:hover span:first-child { transform: translateX(-4px); }
  .menu-btn:hover span:last-child  { transform: translateX(4px); }

  /* ---------- Center Nav ---------- */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .12em;
  }
  .hero a {
    color: var(--fg);
    text-decoration: none;
    font-weight: 700;
    letter-spacing: .02em;
    font-size: clamp(48px, 9vw, 120px);
    line-height: 1.05;
    text-transform: uppercase;
    transition: text-shadow .3s ease, transform .3s ease, opacity .3s ease;
  }
  .hero a:hover {
    text-shadow: var(--glow);
    transform: scale(1.03);
  }

  /* ---------- Footer ---------- */
  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 3vw, 36px);
  }
  .socials {
    display: flex;
    gap: 18px;
  }
  .socials a {
    width: clamp(44px, 4vw, 58px);
    height: clamp(44px, 4vw, 58px);
    border: 2px solid var(--fg);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--fg);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .socials a:hover {
    transform: translateY(-3px);
    box-shadow: var(--glow);
  }
  .socials svg { width: 52%; height: 52%; }

  .contact {
    color: var(--fg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: text-shadow .3s ease, transform .25s ease, filter .25s ease;
  }
  .contact svg {
    width: clamp(40px, 4.5vw, 64px);
    height: auto;
  }
  .contact:hover {
    transform: translateY(-3px);
    filter: drop-shadow(var(--glow));
  }

  @media (max-width: 600px) {
    footer { flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="assets/nop-bg-poster.jpg">
    <source src="assets/nop-bg.mp4" type="video/mp4">
  </video>
  <div class="bg-scrim"></div>

  <div class="page">

    <header>
      <a class="logo" href="#" aria-label="Night of Play home">
        <img src="assets/nop-logo-clear.png" alt="Night of Play">
      </a>
    </header>

    <nav class="hero">
      <a href="#events">Events</a>
      <a href="#gallery">Gallery</a>
      <a href="#playlist">Playlist</a>
    </nav>

    <footer>
      <div class="socials">
        <a href="https://www.tiktok.com/@wearenightofplay" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.5 2h-3v13.2a2.6 2.6 0 1 1-2.05-2.54V9.6a5.8 5.8 0 1 0 5.05 5.75V8.9a6.4 6.4 0 0 0 3.75 1.2V7.05a3.6 3.6 0 0 1-3.7-3.45V2Z"/>
          </svg>
        </a>
        <a href="https://www.instagram.com/nightofplay" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="mailto:info@nightofplay.com" aria-label="Email us" title="Email us">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
            <path d="m4 7 8 5.5L20 7"/>
          </svg>
        </a>
      </div>
    </footer>

  </div>

  <button class="sound-btn" id="soundBtn" aria-label="Unmute sound" title="Unmute">
    <!-- muted icon -->
    <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
      <line x1="17" y1="9" x2="22" y2="14"/>
      <line x1="22" y1="9" x2="17" y2="14"/>
    </svg>
    <!-- unmuted icon -->
    <svg class="icon-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
      <path d="M16.5 8.5a4 4 0 0 1 0 7"/>
      <path d="M19 6a7.5 7.5 0 0 1 0 12"/>
    </svg>
  </button>

  <script>
    (function () {
      var video = document.querySelector('.bg-video');
      var btn = document.getElementById('soundBtn');

      btn.addEventListener('click', function () {
        video.muted = !video.muted;
        btn.classList.toggle('is-unmuted', !video.muted);
        btn.setAttribute('aria-label', video.muted ? 'Unmute sound' : 'Mute sound');
        btn.setAttribute('title', video.muted ? 'Unmute' : 'Mute');
        // Some browsers pause on first interaction; make sure it keeps playing.
        if (video.paused) { video.play().catch(function () {}); }
      });
    })();
  </script>

</body>
</html>
